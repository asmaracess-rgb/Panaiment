    <script>
      (function () {
        var GUARD_KEY = 'pnk_asset_err_reload_ts';
        function recoverFromStaleAsset() {
          try {
            var now = Date.now();
            var last = Number(window.sessionStorage.getItem(GUARD_KEY) || '0');
            if (now - last < 15000) return;
            window.sessionStorage.setItem(GUARD_KEY, String(now));
            if ('caches' in window) {
              window.caches.keys().then(function (keys) {
                keys.forEach(function (k) { window.caches.delete(k); });
              });
            }
            var url = new URL(window.location.href);
            url.searchParams.set('_v', String(now));
            window.location.replace(url.toString());
          } catch (e) {}
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (!t) return;
            var src = t.src || t.href || '';
            if (src && src.indexOf('/assets/') !== -1) {
              recoverFromStaleAsset();
            }
          },
          true
        );
      })();
    </script>

      <style>@keyframes pnk-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
